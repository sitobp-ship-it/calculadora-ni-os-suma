<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#EAF4FF">
<title>Sumas Rápidas</title>
<style>
  :root{
    --bg:#EAF4FF;--card:#FFFFFF;
    --primary:#FF8A5B;--primary-dark:#E5713F;
    --accent:#8B5CF6;--accent-dark:#6B3FD1;
    --blue:#4C9BE8;--blue-dark:#3579BF;
    --good:#5FCF8E;--good-dark:#3AA96B;--good-soft:#E4F9EC;
    --warn:#F5C563;--warn-dark:#D9A63C;--warn-soft:#FFF6E3;
    --bad:#F08A8A;--bad-dark:#D06464;--bad-soft:#FFECEC;
    --text:#2E3A46;--muted:#8A97A6;--line:#E3ECF4;--lock:#C7D2DD;--gold:#F5A800;--r:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,"Segoe UI","Segoe UI Rounded",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(circle at 15% 10%,#FFE7CF 0%,transparent 45%),radial-gradient(circle at 90% 85%,#DDEBFF 0%,transparent 50%),#EAF4FF;
    background-attachment:fixed;color:var(--text);display:flex;justify-content:center;overscroll-behavior:none;-webkit-user-select:none;user-select:none;}
  body.bg-bosque{background:radial-gradient(circle at 20% 10%,#D8F3DC 0%,transparent 50%),radial-gradient(circle at 85% 80%,#B7E4C7 0%,transparent 55%),#EDF9F0;}
  body.bg-playa{background:radial-gradient(circle at 20% 12%,#FFF3C4 0%,transparent 50%),radial-gradient(circle at 85% 82%,#BEE3F8 0%,transparent 55%),#FFFBEB;}
  body.bg-espacio{background:radial-gradient(circle at 25% 15%,#D9C9FF 0%,transparent 50%),radial-gradient(circle at 80% 85%,#C3D4FF 0%,transparent 55%),#EFEAFF;}
  body.bg-noche{background:radial-gradient(circle at 25% 15%,#C7D2FE 0%,transparent 50%),radial-gradient(circle at 80% 85%,#DDD6FE 0%,transparent 55%),#E8EAF8;}
  body.bg-jardin{background:radial-gradient(circle at 20% 10%,#FFD6E8 0%,transparent 50%),radial-gradient(circle at 85% 80%,#E9D5FF 0%,transparent 55%),#FFF0F7;}

  #app{width:100%;max-width:480px;min-height:100vh;padding:10px 16px 26px;display:flex;flex-direction:column;}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}
  h1{font-size:28px;margin:4px 0 2px;font-weight:800;}
  h2{font-size:21px;margin:0 0 4px;font-weight:800;}
  h3{font-size:16px;margin:16px 0 8px;font-weight:800;}
  p{line-height:1.45;}
